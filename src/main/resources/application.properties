spring.application.name=actora

spring.datasource.url=jdbc:h2:mem:test
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.h2.console.enabled=true
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

spring.ai.openai.api-key = ${AI_KEY}
spring.ai.openai.base-url = ${API_BASE_URL}
spring.ai.openai.chat.model = ${CHAT_MODEL}

spring.ai.chat.memory.repository.jdbc.initialize-schema=always
jwt.secret.key=${JWT_SECRET_KEY}
jwt.access.token.expiration.time=${JWT_ACCESS_TIME_LIMIT:60000}
jwt.refresh.token.expiration.time=${JWT_REFRESH_TIME_LIMIT:120000}