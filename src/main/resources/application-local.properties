spring.datasource.url=${DOCKER_DB_URL}
spring.datasource.username=${DOCKER_DB_USERNAME}
spring.datasource.password=${DOCKER_DB_PASSWORD}

#spring.h2.console.enabled=true
#spring.datasource.driver-class-name=org.h2.Driver
#spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format-sql=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata


spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

spring.ai.openai.api-key = ${AI_KEY}
spring.ai.openai.base-url = ${API_BASE_URL}
spring.ai.openai.chat.model = ${CHAT_MODEL}


spring.ai.openai.embedding.model = ${EMBEDDING_MODEL}
spring.ai.openai.embedding.base-url=${API_BASE_URL}
spring.ai.openai.embedding.api-key=${AI_KEY}
spring.ai.openai.embedding.enabled = true

spring.ai.vectorstore.pgvector.index-type = HNSW
spring.ai.vectorstore.pgvector.distance-type= COSINE DISTANCE
spring.ai.vectorstore.pgvector.dimensions= 1024
spring.ai.vectorstore.pgvector.max-document-batch-size= 1000
spring.ai.vectorstore.pgvector.initialize-schema= true

spring.ai.chat.memory.repository.jdbc.initialize-schema=always
jwt.secret.key=${JWT_SECRET_KEY}
jwt.access.token.expiration.time=${JWT_ACCESS_TIME_LIMIT:600000}
jwt.refresh.token.expiration.time=${JWT_REFRESH_TIME_LIMIT:86400000}